<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — To-Do App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">TASK<span>FLOW</span></div>
  <div class="task-count"><strong id="remaining">0</strong> tasks remaining</div>
</header>

<main class="app">
  <section class="hero">
    <p class="eyebrow">WEB DEVELOPMENT INTERNSHIP • TASK 04</p>
    <h1>Get things<br><span>done.</span></h1>
    <p class="subtitle">Organize your tasks, set deadlines, and keep your day moving.</p>
  </section>

  <section class="todo-card">
    <form id="taskForm" class="add-form">
      <input id="taskInput" type="text" placeholder="What needs to be done?" maxlength="120" required>
      <input id="dateInput" type="date" aria-label="Task date">
      <input id="timeInput" type="time" aria-label="Task time">
      <button class="add-btn" type="submit">Add Task +</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button id="clearCompleted" class="text-btn">Clear completed</button>
    </div>

    <div id="taskList" class="task-list"></div>
    <div id="empty" class="empty">No tasks yet. Add your first task above ✨</div>
  </section>
</main>

<footer>© 2026 TaskFlow • SkillCraft Technology Internship</footer>
<script src="script.js"></script>
</body>
</html>
